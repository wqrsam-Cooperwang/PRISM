name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "ci_status.json"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Ruff lint (warning only during V2.2.1 research)
        continue-on-error: true
        run: ruff check .

      - name: Ruff format check (warning only during V2.2.1 research)
        continue-on-error: true
        run: ruff format --check .

      - name: MyPy
        run: mypy

      - name: Tests and coverage
        run: pytest
