name: Governed V2.2 Promotion Enforcement

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref containing the formal ledger data and candidate code
        required: true
        default: main
        type: string
      prediction_root:
        description: Workspace path to the formal performance ledger directory
        required: true
        default: data/performance-ledger
        type: string
      outcome_root:
        description: Workspace path to the verified outcome ledger directory
        required: true
        default: data/outcome-ledger
        type: string
      minimum_scoreline_cases:
        description: Minimum governed settled cases required for scoreline promotion review
        required: true
        default: "30"
        type: string
      minimum_full_stack_cases:
        description: Minimum governed settled cases required for full-stack validation
        required: true
        default: "30"
        type: string

permissions:
  contents: read

jobs:
  governed-v22-promotion-enforcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e "."

      - name: Run governed V2.2 promotion gate
        id: gate
        env:
          PREDICTION_ROOT: ${{ inputs.prediction_root }}
          OUTCOME_ROOT: ${{ inputs.outcome_root }}
          MINIMUM_SCORELINE_CASES: ${{ inputs.minimum_scoreline_cases }}
          MINIMUM_FULL_STACK_CASES: ${{ inputs.minimum_full_stack_cases }}
        run: |
          set +e
          python scripts/governed_v22_promotion_gate.py \
            "$PREDICTION_ROOT" \
            "$OUTCOME_ROOT" \
            governed-v22-promotion/governed-v22-promotion.json \
            --minimum-scoreline-cases "$MINIMUM_SCORELINE_CASES" \
            --minimum-full-stack-cases "$MINIMUM_FULL_STACK_CASES"
          gate_exit_code=$?
          set -e
          echo "exit_code=$gate_exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload governed V2.2 promotion artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: governed-v22-promotion-decision
          path: governed-v22-promotion/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce governed promotion decision
        if: always()
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          if [ -z "$GATE_EXIT_CODE" ]; then
            echo "Governed V2.2 promotion gate did not produce an exit code."
            exit 1
          fi
          exit "$GATE_EXIT_CODE"
